<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <!-- Google custom scripts -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../constants/constants.css">
    <link rel="stylesheet" href="./flow-executions.css">

    <script src="../../utils/utils.js"></script>
    <script type="module" src="../../constants/constants.js"></script>
    <title>AnyEasel - Flow Executions</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="logo" href="#">AnyEasel</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="ml-auto">
                <!-- View All Executions Button -->
                <button id="viewAllExecutionsButton" class="btn border mr-2 viewAllButton" type="button">📋 View All Executions</button>
                <!-- Back Button -->
                <button id="backButton" class="btn border mr-2 backButton" type="button">← Back to Flows</button>
                <!-- Refresh Button -->
                <button id="refreshButton" class="btn border refreshButton" type="button">🔄 Refresh</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h2 id="pageTitle" class="mb-4">Flow Execution Status</h2>

                <!-- Loading Spinner -->
                <div id="loadingSpinner" class="text-center">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <p>Loading execution status...</p>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="alert alert-danger" role="alert" hidden>
                    <strong>Error:</strong> <span id="errorText"></span>
                </div>

                <!-- Execution Details Card -->
                <div id="executionDetailsCard" class="card" hidden>
                    <div class="card-header">
                        <h4>Execution Details</h4>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <p><strong>Flow ID:</strong> <span id="flowId"></span></p>
                                <p><strong>Execution Timestamp:</strong> <span id="executionTimestamp"></span></p>
                            </div>
                            <div class="col-md-6">
                                <p><strong>Status:</strong> <span id="status" class="badge"></span></p>
                            </div>
                        </div>

                        <hr>

                        <div class="row">
                            <div class="col-md-12">
                                <h5>Output Details</h5>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <p><strong>Workbook Bucket:</strong> <span id="workbookBucket"></span></p>
                                <p><strong>Workbook Key:</strong> <span id="workbookKey"></span></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- No Execution Data -->
                <div id="noDataMessage" class="alert alert-info" role="alert" hidden>
                    <strong>No Data:</strong> Could not find execution data. Please check the flow ID and execution timestamp.
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="flow-executions.js"></script>
</body>
</html>
