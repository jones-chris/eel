<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <link rel="stylesheet" href="../../constants/constants.css">
    <link rel="stylesheet" href="./create-flow.css">

    <script src="../../utils/utils.js"></script>
    <script src="../../shared/input-source.js"></script>
    <script src="../../shared/sql-transformation.js"></script>
    <script src="../../shared/output-destination.js"></script>
    <script src="./DestinationService.js"></script>
    <script src="../../shared/email-destination.js"></script>
    <script src="../../shared/sms-destination.js"></script>
    <script src="../../shared/file-storage-destination.js"></script>
    <script src="../../shared/database-write-destination.js"></script>
    <script src="../../shared/queue-write-destination.js"></script>
    <script src="../../shared/trigger-flow-destination.js"></script>
    <title>Hello, world!</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <!-- todo:  might be able to remove this because it's a few lines below too. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <!-- Necessary for the Dropdown animation to work. -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">AnyAuto</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="ml-auto">
                <!-- Flow type drop down -->
                <div class="dropdown d-inline-block mr-2">
                    <button class="btn border flowTypeButton" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        ☰ Flow Type
                    </button>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <a id="xlsxFile" class="dropdown-item" href="#">XLSX File</a>
                        <a id="sqlScript" class="dropdown-item" href="#">SQL Script</a>
                        <a id="pythonScript" class="dropdown-item" href="#">Python Script</a>
                        <a id="pythonZipFile" class="dropdown-item" href="#">Python Zip File</a>
                    </div>
                </div>
                <!-- Save Button -->
                <button class="btn border mr-2 saveButton" type="button">💾 Save</button>
                <!-- Deploy Button -->
                <button class="btn border deployButton" type="button">🚀 Deploy</button>
            </div>
        </div>
    </nav>

    <table class="table table-striped-columns">
        <tr>
            <th class="tableHeader">Inputs </th>
            <th class="tableHeader">Transformation</th>
            <th class="tableHeader">Outputs</th>
        </tr>
        <tr>
            <!-- Input sources -->
            <td id="inputSources"></td>

            <!-- xlsx transformation upload -->
            <td id="xlsxTransformationUpload" hidden>
                <div class="left-screen">
                    <form id="fileUploadForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="fileInput" class="form-label">Upload File</label>
                            <input type="file" class="form-control" id="fileInput" name="file" required style="width: auto;" >
                        </div>
                        <button id="uploadButton" type="submit" class="btn btn-primary">
                            <span id="uploadSpinner" class="spinner-border spinner-border-sm" role="status" aria-hidden="true" hidden></span>
                            <span id="uploadButtonText">Upload</span>
                        </button>
                    </form>
                </div>
            </td>

            <!-- Output destinations -->
            <td id="outputDestinations"></td>
        </tr>
    </table>
</body>

<script src="create-flow.js"></script>
</html>
